<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f"><title>ASCII Studio</title>
  <style>
  :root{color-scheme:dark;--bg:#10110f;--panel:#191b18;--line:#30342e;--text:#f0f3eb;--muted:#9da69a;--accent:#c4f06b}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% -15%,#35412b 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:28px 24px 48px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:#17200b;font:800 17px monospace}h1{margin:0;font-size:32px}.subtitle{color:var(--muted);margin:3px 0}.badge{color:var(--accent);border:1px solid #465437;padding:7px 10px;border-radius:999px;font-size:12px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px}.panel,.workspace{background:#191b18;border:1px solid var(--line);border-radius:16px}.panel{padding:18px}.panel h2{font-size:14px;margin:0 0 15px}.group{padding:15px 0;border-top:1px solid var(--line)}.group:first-of-type{border-top:0;padding-top:0}.label-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}.value{color:var(--accent)}select,input[type=text]{width:100%;padding:10px;color:var(--text);background:#20231f;border:1px solid var(--line);border-radius:9px}input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:40px;height:34px;padding:3px;background:#20231f;border:1px solid var(--line);border-radius:8px}.hint{margin:7px 0 0;color:var(--muted);font-size:11px}.color-row{display:flex;gap:10px}.color-row select{flex:1}.toggle-row{display:flex;justify-content:space-between}.toggle-row input{accent-color:var(--accent)}button{border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);background:#20231f;cursor:pointer}button:hover{border-color:#68735d}button:disabled{opacity:.45}.primary{background:var(--accent);color:#17200b;border-color:var(--accent);font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.tabs,.actions{display:flex;gap:7px}.tab,.actions button{padding:8px 11px;font-size:12px}.tab.active{border-color:var(--accent);color:var(--accent)}.dropzone{margin:16px;min-height:160px;border:1px dashed #59634f;border-radius:13px;display:grid;place-items:center;text-align:center;padding:20px;background:#171a15;cursor:pointer}.dropzone strong{display:block}.dropzone p{margin:0;color:var(--muted);font-size:13px}.upload-icon{display:block;color:var(--accent);font-size:27px}#fileInput{display:none}.preview-area{padding:0 16px 16px}.preview-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}.preview{min-height:220px;max-height:68vh;overflow:auto;background:#090a08;border:1px solid var(--line);border-radius:11px;padding:17px;display:grid;place-items:start center}#asciiOutput{margin:0;white-space:pre;font:700 7px/1 "Courier New",monospace}.empty{color:#788073;text-align:center;margin:auto}.hidden{display:none!important}.notice{min-height:18px;color:var(--accent);font-size:12px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}.panel{order:2}.workspace{order:1}}@media(max-width:560px){.wrap{padding:18px 12px}.badge{display:none}.toolbar{align-items:flex-start;flex-direction:column}.preview{max-height:55vh;padding:10px}}
  </style>
</head>
<body><div class="wrap"><header><div class="brand"><div class="logo">A·S</div><div><h1>ASCII Studio</h1><p class="subtitle">Преврати фотографию в текстовое искусство</p></div></div><span class="badge">Без сервера · всё локально</span></header>
<main class="layout"><aside class="panel"><h2>Настройки изображения</h2>
<div class="group"><div class="label-row"><label for="style">Стиль символов</label></div><select id="style"><option value="classic">Классический</option><option value="blocks">Блоки</option><option value="matrix">Matrix</option><option value="braille">Брайль</option><option value="dots">Точки</option><option value="binary">Бинарный</option><option value="minimal">Минимализм</option><option value="custom">Свой набор</option></select></div>
<div class="group"><div class="label-row"><label for="width">Ширина ASCII</label><span class="value" id="widthValue">100</span></div><input id="width" type="range" min="40" max="220" value="100"></div>
<div class="group"><div class="label-row"><label for="brightness">Яркость</label><span class="value" id="brightnessValue">0</span></div><input id="brightness" type="range" min="-100" max="100" value="0"><div class="label-row" style="margin-top:12px"><label for="contrast">Контраст</label><span class="value" id="contrastValue">0</span></div><input id="contrast" type="range" min="-100" max="100" value="0"></div>
<div class="group"><div class="label-row"><label for="fontSize">Размер символов</label><span class="value" id="fontSizeValue">7 px</span></div><input id="fontSize" type="range" min="4" max="14" value="7"></div>
<div class="group"><div class="label-row"><label for="customChars">Свой набор символов</label></div><input id="customChars" type="text" value="@%#*+=-:. "><p class="hint">От тёмного к светлому.</p></div>
<div class="group"><div class="label-row"><label for="colorMode">Цвет</label></div><div class="color-row"><select id="colorMode"><option value="mono">Монохромный</option><option value="original">Цвета оригинала</option><option value="tint">Один оттенок</option><option value="green">Зелёный терминал</option></select><input id="tintColor" type="color" value="#c4f06b"></div></div>
<div class="group"><label class="toggle-row"><span>Инвертировать яркость</span><input id="invert" type="checkbox"></label></div>
<div class="group"><button id="reset" style="width:100%">Сбросить настройки</button></div></aside>
<section class="workspace"><div class="toolbar"><div class="tabs"><button class="tab active" id="asciiTab">ASCII</button><button class="tab" id="imageTab">Оригинал</button></div><div class="actions"><button id="copyBtn" disabled>Скопировать</button><button id="txtBtn" disabled>TXT</button><button class="primary" id="pngBtn" disabled>Скачать PNG</button></div></div>
<label class="dropzone" id="dropzone" for="fileInput"><span><span class="upload-icon">▧</span><strong>Перетащи изображение сюда</strong><p>или нажми для выбора · JPG, PNG, GIF, WebP</p></span></label><input id="fileInput" type="file" accept="image/*">
<div class="preview-area"><div class="preview-head"><span id="previewLabel">Предпросмотр ASCII</span><span id="dimensions"></span></div><div class="preview"><div class="empty" id="emptyState">Загрузи изображение, чтобы начать.</div><pre id="asciiOutput" class="hidden"></pre><img id="originalImage" class="hidden" style="max-width:100%;max-height:62vh;object-fit:contain"></div><div class="notice" id="notice"></div></div></section></main></div>
<script>
(()=>{const presets={classic:" .'`^,:;Il!i><~+_-?][}{1)(|\\/*tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",blocks:" ░▒▓█",matrix:" .:-=+*#%@01",braille:" ⠁⠃⠇⠏⠟⠿",dots:" .·:•●",binary:" 01",minimal:" .:-=+",custom:""};const $=id=>document.getElementById(id),canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});let image=new Image(),loaded=false,showingOriginal=false,currentText="",rows=[];
function notice(s){$("notice").textContent=s;if(s)setTimeout(()=>{if($("notice").textContent===s)$("notice").textContent=""},2600)}function loadFile(file){if(!file||!file.type.startsWith("image/")){notice("Выбери файл изображения");return}const url=URL.createObjectURL(file);image.onload=()=>{URL.revokeObjectURL(url);loaded=true;$('originalImage').src=image.src;$('dropzone').classList.add("hidden");["copyBtn","txtBtn","pngBtn"].forEach(id=>$(id).disabled=false);render()};image.onerror=()=>{URL.revokeObjectURL(url);notice("Не удалось открыть изображение")};image.src=url}
$("fileInput").onchange=e=>loadFile(e.target.files[0]);const dz=$('dropzone');dz.ondragover=e=>{e.prevent.preventDefault?.(),e.preventDefault();dz.style.borderColor='#c4f06b'};dz.ondragleave=()=>dz.style.borderColor='';dz.ondrop=e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])};
function chars(){const s=$("style").value;return s==='custom'?($('customChars').value||'@%#*+=-:. '):presets[s]}function channel(v,b,c){v+=b*2.55;const f=259*(c+255)/(255*(259-c));return Math.max(0,Math.min(255,f*(v-128)+128))}
function render(){if(!loaded)return;const cols=+$('width').value,font=+$('fontSize').value,rs=Math.max(1,Math.round(cols*image.height/image.width*.48));canvas.width=cols;canvas.height=rs;ctx.drawImage(image,0,0,cols,rs);const p=ctx.getImageData(0,0,cols,rs).data,b=+$('brightness').value,c=+$('contrast').value,mode=$('colorMode').value,tint=$('tintColor').value;rows=[];let html='',text='';for(let y=0;y<rs;y++){let line='',lineHtml='';for(let x=0;x<cols;x++){const i=(y*cols+x)*4,r=channel(p[i],b,c),g=channel(p[i+1],b,c),bl=channel(p[i+2],b,c);let lum=.2126*r+.7152*g+.0722*bl;if($('invert').checked)lum=255-lum;const ch=chars()[Math.round((255-lum)/255*(chars().length-1))]||' ';line+=ch;let color='#dce5d2';if(mode==='original')color=`rgb(${r},${g},${bl})`;if(mode==='tint')color=tint;if(mode==='green')color='#8df58b';const esc=ch==='&'?'&amp;':ch==='<'?'&lt;':ch==='>'?'&gt;':ch;lineHtml+=`<span style="color:${color}">${esc}</span>`}text+=line+(y<rs-1?'\n':'');html+=lineHtml+(y<rs-1?'\n':'');rows.push(line)}currentText=text;$('asciiOutput').innerHTML=html;$('asciiOutput').style.fontSize=font+'px';$('asciiOutput').classList.toggle('hidden',showingOriginal);$('originalImage').classList.toggle('hidden',!showingOriginal);$('emptyState').classList.add('hidden');$('previewLabel').textContent=showingOriginal?'Оригинальное изображение':'Предпросмотр ASCII';$('dimensions').textContent=`${cols} × ${rs} символов`}
['style','width','brightness','contrast','fontSize','customChars','colorMode','tintColor','invert'].forEach(id=>$(id).addEventListener('input',()=>{$('widthValue').textContent=$('width').value;$('brightnessValue').textContent=$('brightness').value;$('contrastValue').textContent=$('contrast').value;$('fontSizeValue').textContent=$('fontSize').value+' px';render()}));$('asciiTab').onclick=()=>{showingOriginal=false;$('asciiTab').classList.add('active');$('imageTab').classList.remove('active');render()};$('imageTab').onclick=()=>{showingOriginal=true;$('imageTab').classList.add('active');$('asciiTab').classList.remove('active');render()};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(currentText);notice('ASCII-текст скопирован')}catch(e){const a=document.createElement('textarea');a.value=currentText;document.body.append(a);a.select();document.execCommand('copy');a.remove();notice('ASCII-текст скопирован')}};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('txtBtn').onclick=()=>dl(new Blob([currentText],{type:'text/plain;charset=utf-8'}),'ascii-art.txt');$('pngBtn').onclick=()=>{const font=+$('fontSize').value,cw=font*.61,pad=28,c=document.createElement('canvas');c.width=Math.ceil(rows[0].length*cw+pad*2);c.height=Math.ceil(rows.length*font+pad*2);const x=c.getContext('2d');x.fillStyle='#090a08';x.fillRect(0,0,c.width,c.height);x.font=`700 ${font}px Courier New`;rows.forEach((row,y)=>[...row].forEach((ch,a)=>{let color='#dce5d2';if($('colorMode').value==='tint')color=$('tintColor').value;if($('colorMode').value==='green')color='#8df58b';x.fillStyle=color;x.fillText(ch,pad+a*cw,pad+y*font)}));c.toBlob(b=>b&&dl(b,'ascii-art.png'))};
$('reset').onclick=()=>{$('style').value='classic';$('width').value=100;$('brightness').value=0;$('contrast').value=0;$('fontSize').value=7;$('customChars').value='@%#*+=-:. ';$('colorMode').value='mono';$('tintColor').value='#c4f06b';$('invert').checked=false;$('widthValue').textContent=100;$('brightnessValue').textContent=0;$('contrastValue').textContent=0;$('fontSizeValue').textContent='7 px';render()}})();
</script></body></html>
